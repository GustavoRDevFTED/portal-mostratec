<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MostraTec Uniube — ciência, tecnologia e inovação.">
  <title>{% block title %}MostraTec | Uniube{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="{{ url_for('home.index') }}">
      <span class="brand-mark">M</span>
      <span>MostraTec<small>UNIUBE</small></span>
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
    <nav class="main-nav" id="mainNav">
      <a href="{{ url_for('home.index') }}" class="{{ 'active' if request.endpoint == 'home.index' else '' }}">Início</a>
      <a href="{{ url_for('history.index') }}" class="{{ 'active' if request.endpoint == 'history.index' else '' }}">Nossa história</a>
      <a href="{{ url_for('articles.index') }}" class="{{ 'active' if request.endpoint == 'articles.index' else '' }}">Artigos científicos</a>
      <a href="{{ url_for('categories.index') }}" class="{{ 'active' if request.endpoint == 'categories.index' else '' }}">Categorias</a>
    </nav>
  </div>
</header>

<main>{% block content %}{% endblock %}</main>

<footer class="site-footer">
  <div class="container footer-content">
    <div>
      <a class="brand brand-light" href="{{ url_for('home.index') }}">
        <span class="brand-mark">M</span><span>MostraTec<small>UNIUBE</small></span>
      </a>
      <p>Ciência, tecnologia e inovação construídas na universidade.</p>
    </div>
    <div class="footer-links">
      <a href="{{ url_for('history.index') }}">História</a>
      <a href="{{ url_for('articles.index') }}">Artigos</a>
      <a href="{{ url_for('categories.index') }}">Categorias</a>
    </div>
  </div>
  <div class="container copyright">© {{ 2026 }} MostraTec Uniube. Conteúdo institucional.</div>
</footer>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
